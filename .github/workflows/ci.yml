name: CI

# Three teammates work on branches off main, so the point of this workflow is
# that a pull request cannot quietly turn the suite red. It runs the same two
# suites that are run locally, and nothing else -- a gate nobody trusts is worse
# than no gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each suite writes its output to a log and, on failure, echoes the tail back as
# an error annotation. GitHub requires a signed-in session to read Actions logs
# even on a public repository, while annotations are readable by anyone, so a
# bare "Process completed with exit code 1" tells an outside contributor
# nothing. This makes the failure legible without an account.
jobs:
  frontend:
    name: Frontend — tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, matching frontend/Dockerfile. Node 20 fails before running a
      # single test: jsdom 30's bundled undici calls `webidl.util.markAsUncloneable`,
      # a Node internal that does not exist on every 20.x release, so `vitest run`
      # dies during environment setup with "not a function".
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # package.json already defines test as `vitest run` -- no watch mode to
      # escape from, so a plain `npm test` cannot hang the runner.
      - name: Test
        working-directory: frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/frontend-test.log

      # The build is a type check with teeth: `vite build` runs `tsc -b` first,
      # so a contract drift between the frontend types and the API schema fails
      # here rather than in front of a judge.
      - name: Build
        working-directory: frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log

      - name: Surface the failure
        if: failure()
        run: |
          for f in /tmp/frontend-test.log /tmp/frontend-build.log; do
            [ -f "$f" ] || continue
            echo "::error title=Frontend ($f)::$(tail -40 "$f" | sed -z 's/\n/%0A/g')"
          done

  mockups:
    name: Mockups — claim audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The auditor uses only the standard library, so this job needs no install
      # and finishes in seconds. It validates every MRZ on the page, cross-checks
      # the decoded fields against the printed dates beside them, and greps for
      # claims the system cannot back.
      #
      # Anything a judge will see belongs in docs/mockups/. While that directory
      # is empty this job says so and passes -- it does not silently succeed on
      # nothing, because "no files checked" and "all files clean" are different
      # facts and only one of them is reassuring.
      - name: Audit
        run: |
          shopt -s nullglob
          pages=(docs/mockups/*.html)
          if [ ${#pages[@]} -eq 0 ]; then
            echo "::notice title=Mockup audit::No pages in docs/mockups/ — nothing audited. Commit the team's mockups there and this job will check every MRZ and claim on them."
            exit 0
          fi
          python backend/scripts/audit_mockup_claims.py "${pages[@]}"

  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    # Installing paddlepaddle, torch and insightface is several minutes of wheel
    # downloads, and buffalo_l pulls another 281 MB on first use.
    timeout-minutes: 45

    # The audit-log tests need a real database. Locally they never touch one:
    # psycopg is not installed in the dev venv, so `get_engine` fails to build
    # the configured Postgres engine and silently falls back to SQLite. CI does
    # install psycopg, the engine builds, and the connection to compose's `db`
    # host then fails at runtime -- which is how this first showed up.
    #
    # So Postgres here is not ceremony: it is the first time the append-only
    # audit schema is exercised against the database it actually ships on.
    # postgres:15-alpine matches docker-compose.yml.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: veridoc
          POSTGRES_PASSWORD: veridoc
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veridoc -d veridoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Reached over the mapped port, not by service name: these steps run on the
      # runner host, not inside a job container.
      DATABASE_URL: postgresql+psycopg://veridoc:veridoc@localhost:5432/veridoc

    steps:
      - uses: actions/checkout@v4

      # Python 3.12, matching backend/Dockerfile and the local venv. Several
      # pinned dependencies publish no 3.11 wheel at all.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # OpenCV needs these at import time on a slim runner, same as the image.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      # Model weights, not code: keyed on the requirements hash, since that is
      # what decides which model versions get fetched.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.insightface
            ~/.paddlex
          key: models-${{ hashFiles('backend/requirements.txt') }}

      # `-ra` prints the reason for every skip. That matters here: the FantasyID
      # split is 2 GB and gitignored, so the tests that score against real
      # held-out data cannot run on a runner and skip by design. Naming them each
      # run is what stops a silently shrinking suite from looking green -- which
      # is this project's recurring failure mode applied to its own CI.
      - name: Test
        working-directory: backend
        run: |
          set -o pipefail
          pytest -q -ra --tb=short 2>&1 | tee /tmp/backend-test.log

      - name: Surface the failure
        if: failure()
        run: |
          [ -f /tmp/backend-test.log ] || exit 0
          echo "::error title=Backend pytest::$(tail -40 /tmp/backend-test.log | sed -z 's/\n/%0A/g')"
