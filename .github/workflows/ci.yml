name: CI

# Three teammates work on branches off main, so the point of this workflow is
# that a pull request cannot quietly turn the suite red. It runs the same two
# suites that are run locally, and nothing else -- a gate nobody trusts is worse
# than no gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # package.json already defines test as `vitest run` -- no watch mode to
      # escape from, so a plain `npm test` cannot hang the runner.
      - name: Test
        working-directory: frontend
        run: npm test

      # The build is a type check with teeth: `vite build` runs `tsc -b` first,
      # so a contract drift between the frontend types and the API schema fails
      # here rather than in front of a judge.
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    # Installing paddlepaddle, torch and insightface is several minutes of wheel
    # downloads, and buffalo_l pulls another 281 MB on first use.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Python 3.12, matching backend/Dockerfile and the local venv. Several
      # pinned dependencies publish no 3.11 wheel at all.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # OpenCV needs these at import time on a slim runner, same as the image.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      # Model weights, not code: keyed on the requirements hash, since that is
      # what decides which model versions get fetched.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.insightface
            ~/.paddlex
          key: models-${{ hashFiles('backend/requirements.txt') }}

      # `-ra` prints the reason for every skip. That matters here: the FantasyID
      # split is 2 GB and gitignored, so the tests that score against real
      # held-out data cannot run on a runner and skip by design. Naming them each
      # run is what stops a silently shrinking suite from looking green -- which
      # is this project's recurring failure mode applied to its own CI.
      - name: Test
        working-directory: backend
        run: pytest -q -ra --tb=short
